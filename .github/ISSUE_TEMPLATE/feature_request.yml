name: Feature Request
description: Suggest a new feature or improvement
title: "feat: "
labels: ["enhancement", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Keep the `feat:` title prefix and file this issue in English. You do not need to
        apply labels; maintainers assign priority and size after triage.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the behavior you would like to see
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternatives you have considered
    validations:
      required: false
