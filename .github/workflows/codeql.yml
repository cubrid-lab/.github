name: CodeQL Security Scan

on:
  workflow_call:
    inputs:
      language:
        description: 'Language to scan (python or javascript)'
        required: false
        default: 'python'
        type: string
      category:
        description: >-
          Code scanning category of the upload, for example /language:go. Give
          each analysis of one repository its own category when a repository
          calls this workflow more than once; two analyses in one category
          replace each other's alerts. Empty keeps the default category.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ inputs.language }}
          queries: +security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: ${{ inputs.category }}
